  const html = c.paras.map(p => '<p>' + p.map(x => {
    if (x.t === 'text') return esc(x.v);
    if (!set.has(x.id)) return `${esc(x.id)}（${esc(x.zh)}）`;
    const a = cur.ans[x.id], cls = a === undefined ? '' : a ? 'ok' : 'no';
    return zh ? `${esc(x.id)}（<input class="quiz-in ${cls}" data-id="${x.id}" ${a !== undefined ? 'value="' + esc(a ? x.zh : '') + '"' : ''} onchange="chk(this)" placeholder="＿＿">）`
              : `<input class="quiz-in ${cls}" data-id="${x.id}" style="width:110px" onchange="chk(this)" placeholder="＿＿">（${esc(x.zh)}）`;
  }).join('') + '</p>').join('');
  $('#app').innerHTML = `<div class="row"><button class="chip" onclick="go('read',{ch:${cur.ch}})">${ico('left')} 返回閱讀</button><div class="sp"></div><span class="mute">已答 ${done}/${cur.shuffle.length} · 正確 ${ok}</span></div><h1>默寫自測</h1>
  <div class="tools">${[['zh', '給英文寫中文'], ['en', '給中文寫英文']].map(t => `<button class="chip ${cur.mode === t[0] ? 'on' : ''}" onclick="cur.mode='${t[0]}';cur.shuffle=[];render()">${t[1]}</button>`).join('')}
  ${[['ch', '本章全部'], ['nb', '只考生詞本'], ['due', '只考待複習']].map(t => `<button class="chip ${cur.scope === t[0] ? 'on' : ''}" onclick="cur.scope='${t[0]}';render()">${t[1]}</button>`).join('')}
  <button class="chip" onclick="cur.shuffle=[];render()">清空重考</button></div>
  <div class="read card">${html}</div><div class="mute">輸入後按 Enter 或點別處即判分。答對算「記得」，答錯算「忘了」並加入生詞本。</div>`;
}
function chk(el) {
  const id = el.dataset.id, w = D.words[id], v = el.value.trim(); if (!v || cur.ans[id] !== undefined) return;
  const ok = cur.mode === 'zh' ? v.length >= 1 && (w.zh.includes(v) || v.includes(w.zh.replace(/[的地]$/, ''))) : v.toLowerCase() === id;
  cur.ans[id] = ok; addWord(id, chOf(id)); rate(id, ok ? 'good' : 'again', 'quiz');
  el.classList.add(ok ? 'ok' : 'no'); if (!ok) el.value = (cur.mode === 'zh' ? w.zh : id) + ' ✗';
  const st = document.querySelector('.row .mute'); if (st) st.textContent = `已答 ${Object.keys(cur.ans).length}/${cur.shuffle.length} · 正確 ${Object.values(cur.ans).filter(Boolean).length}`;
}
/* ---------- 統計 / 設定 ---------- */
function stats() {
  const all = Object.values(S.words), t0 = new Date().setHours(0, 0, 0, 0), today = S.log.filter(l => l.at >= t0);
  const days = new Set(S.log.map(l => new Date(l.at).toDateString())); let streak = 0;
  for (let d = new Date(); days.has(d.toDateString()); d.setDate(d.getDate() - 1)) streak++;
  const box = (n, l) => `<div class="card" style="text-align:center;margin:0"><div style="font-size:28px;font-weight:700;color:var(--acct)">${n}</div><div class="mute">${l}</div></div>`;
  $('#app').innerHTML = `<h1>學習統計</h1><div class="grid" style="grid-template-columns:repeat(2,1fr)">${box(today.length, '今日複習/自測次數')}${box(streak, '連續學習天數')}${box(all.filter(u => u.inNb).length, '生詞本單字')}${box(all.filter(u => u.mastered).length, '已掌握')}${box(all.filter(u => u.lapses >= 2).length, '難詞')}${box(dueList().length, '待複習')}</div>
  <h2>全書掌握率</h2><div class="bar"><div style="width:${all.filter(u => u.mastered).length / Object.keys(D.words).length * 100}%"></div></div><div class="mute">${all.filter(u => u.mastered).length} / ${Object.keys(D.words).length}</div>`;
}
function set() {
  const s = S.set;
  $('#app').innerHTML = `<h1>設定</h1><div class="card row"><div><b>${esc(PROF)}</b><div class="mute" id="sync">${syncText()}</div></div><div class="sp"></div><button class="btn sm ghost" onclick="switchUser()">切換使用者</button></div><div class="card">
  <p>發音：<select onchange="S.set.accent=this.value;save()"><option value="US" ${s.accent === 'US' ? 'selected' : ''}>美式</option><option value="UK" ${s.accent === 'UK' ? 'selected' : ''}>英式</option></select></p>
  <p>主題：<select onchange="S.set.theme=this.value;save();render()">${[['light', '淺色'], ['sepia', '米色護眼'], ['dark', '深色']].map(t => `<option value="${t[0]}" ${s.theme === t[0] ? 'selected' : ''}>${t[1]}</option>`).join('')}</select></p>
  <p>每日複習上限：<select onchange="S.set.limit=+this.value;save()">${[20, 50, 100, 200].map(n => `<option ${s.limit === n ? 'selected' : ''}>${n}</option>`).join('')}</select></p></div>
  <div class="card"><div class="mute">可匯出備份檔作為額外保險。</div><div class="row" style="margin-top:8px"><button class="btn sm" onclick="exp()">匯出備份</button><button class="btn sm ghost" onclick="imp()">匯入備份</button><button class="btn sm ghost" onclick="if(confirm('確定清除所有學習紀錄？')){S.words={};S.prog={};S.log=[];save();render()}">清除紀錄</button><button class="btn sm ghost" onclick="delUser()">刪除此使用者</button></div></div>`;
}
function exp() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type: 'application/json'})); a.download = 'ielts-novel-backup.json'; a.click(); }
function imp() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = () => i.files[0].text().then(t => { try { S = Object.assign(S, JSON.parse(t)); save(); render(); } catch (e) { alert('檔案格式不正確'); } }); i.click(); }
loadRemoteNames();
render();
</script>
