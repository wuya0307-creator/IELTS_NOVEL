<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雅思小說閱讀</title>
<style>
:root{--bg:#f5f8fc;--fg:#1f2733;--mute:#7b8594;--card:#fff;--line:#dde5ef;--acc:#8BB8E8;--acct:#3d73b0;--on:#0f2542;--accbg:#e4eefa;--wordbg:rgba(120,125,135,.16)}
[data-theme=sepia]{--bg:#f4ecd8;--card:#fbf5e6;--line:#dcd0b4;--wordbg:rgba(110,110,100,.16)}
[data-theme=dark]{--bg:#17161a;--fg:#e6e2dc;--mute:#908a82;--card:#222127;--line:#34323a;--acc:#8BB8E8;--acct:#8BB8E8;--accbg:#23364d;--wordbg:rgba(200,205,215,.16)}
*{box-sizing:border-box}
body{touch-action:manipulation;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:20px 0 8px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--acct);border:1px solid var(--acc)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;padding:10px 0;font-size:12px;color:var(--mute)}
nav button.on{color:var(--acct);font-weight:700}nav b{display:block;height:24px}nav svg,.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}nav svg{width:24px;height:24px}
/* reader */
.read{font-size:var(--fs,18px);line-height:var(--lh,2.1)}
.read p{margin:0 0 1.2em;text-align:justify}
.w{background:var(--wordbg);border-radius:6px;padding:1px 6px;cursor:pointer;white-space:nowrap}
.w.hz i{display:none}.w.he span{display:none}
.w i{font-style:normal;opacity:.85}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
/* sheet */
#ov{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}
#ov.show{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
@media(min-width:700px){#ov{align-items:center}#sheet{border-radius:20px}}
.hw{font-size:30px;font-weight:700}.pos{color:var(--mute);font-size:14px;margin-left:6px}
.tag{display:inline-block;background:var(--accbg);color:var(--acct);border-radius:6px;padding:2px 8px;font-size:12px;margin-right:4px}
.ctx{background:var(--bg);border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.8;margin:8px 0}
.ctx mark{background:var(--accbg);color:var(--acct);border-radius:4px;padding:0 3px;font-weight:700}
.syn{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:3px 10px;margin:3px 4px 3px 0;font-size:14px}
.quiz-in{width:92px;border:0;border-bottom:2px solid var(--acc);background:transparent;font:inherit;color:var(--fg);text-align:center;padding:0 2px}
.quiz-in.ok{border-color:#3a9d5d;color:#3a9d5d}.quiz-in.no{border-color:#d9534f;color:#d9534f}
.big{font-size:34px;font-weight:700;text-align:center;margin:30px 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar>div{height:100%;background:var(--acc)}
.pf{cursor:pointer;width:110px;color:var(--mute)}.pf:hover{color:var(--fg)}.pf:hover .av{border-color:var(--acc)}
.av{width:110px;height:110px;border-radius:18px;border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;background:hsl(var(--h) 45% 42%);margin-bottom:8px}
.av.add{background:transparent;border:2px dashed var(--line);color:var(--mute)}.av.add svg{width:44px;height:44px}
.rin{border:0;background:linear-gradient(90deg,var(--acc) 0 var(--u),transparent var(--u)) left bottom/var(--p) 2px repeat-x;font:inherit;color:var(--fg);text-align:left;padding:0 0 1px;margin:0 3px;vertical-align:baseline;border-radius:0}
.rin.zh{--u:1em;--p:1.2em;letter-spacing:.2em}
.rin.en{--u:1ch;--p:1.35ch;letter-spacing:.35ch;font-family:ui-monospace,Consolas,Menlo,monospace;font-size:.92em}
.rin:focus{outline:0;background:var(--accbg)}
.okc{color:#3a9d5d;font-style:normal;font-weight:600}.noc{color:#d9534f;font-style:normal;font-weight:600}
#wb{display:none;position:fixed;z-index:6;background:var(--card);border:1px solid var(--line);flex-direction:column}
body.wb-open #wb{display:flex}
#wb,#wb *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
#wb .wbh{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#wb .sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;padding:0}
#wb .sw.on{border-color:var(--acct);outline:2px solid var(--card);outline-offset:-4px}
#wbc{flex:1;width:100%;min-height:0;touch-action:none;cursor:crosshair;background-color:#fffef9;background-image:repeating-linear-gradient(transparent 0 31px,#e6e9ef 31px 32px)}
@media(min-width:900px){#wb{top:0;right:0;bottom:0;width:min(42vw,440px);border-width:0 0 0 1px}body.wb-open #app{margin:0;padding-left:28px;max-width:min(760px,calc(100vw - min(42vw,440px)))}}
@media(max-width:899px){#wb{left:0;right:0;bottom:0;height:46vh;border-width:1px 0 0}body.wb-open #app{padding-bottom:calc(46vh + 20px)}}
select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:5px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="wb"><div class="wbh">
  <button class="sw" data-c="#1f2733" style="background:#1f2733" onclick="wbPick('#1f2733')" aria-label="黑筆"></button>
  <button class="sw" data-c="#2f6fd6" style="background:#2f6fd6" onclick="wbPick('#2f6fd6')" aria-label="藍筆"></button>
  <button class="sw" data-c="#d9534f" style="background:#d9534f" onclick="wbPick('#d9534f')" aria-label="紅筆"></button>
  <button class="chip" id="wbe" onclick="wbPick('eraser')" aria-label="橡皮擦"></button>
  <span class="sp"></span>
  <button class="chip" id="wbu" onclick="wbUndo()" aria-label="復原"></button>
  <button class="chip" id="wbt" onclick="wbClear()" aria-label="清除"></button>
  <button class="chip" id="wbx" onclick="wbToggle()" aria-label="收起"></button>
</div><canvas id="wbc"></canvas></div>
<div id="ov"><div id="sheet"></div></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
const IC = {
 book:'<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
 repeat:'<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
 notebook:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 3v18M12 8h4M12 12h4"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 vol:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 left:'<path d="m15 18-6-6 6-6"/>',
 check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
 pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 eraser:'<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
 star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const ico = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const D = window.DATA, $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- 使用者 / 儲存 / 雲端同步（Firestore REST，免登入） ---------- */
const CFG = window.SYNC_CONFIG || {}, SYNC_ON = !!(CFG.projectId && CFG.apiKey);
const FS = `https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents/users`;
const DEF = () => ({words: {}, prog: {}, set: {theme: 'light', fs: 18, accent: 'US', limit: 50, hz: false, he: false}, log: [], updatedAt: 0});
let S = DEF(), PROF = null, syncState = SYNC_ON ? 'idle' : 'off', pushT = null;
const pkey = n => 'ielts-novel-v2:' + n;
const norm = o => { const d = DEF(); return Object.assign(d, o, {set: Object.assign(d.set, (o || {}).set)}); };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function profiles() { try { const l = JSON.parse(lsGet('ielts-profiles') || 'null'); if (l && l.length) return l; } catch (e) {} return ['HCW']; }
function setProfiles(l) { lsSet('ielts-profiles', JSON.stringify([...new Set(l)])); }
(function migrate() { const old = lsGet('ielts-novel-v1'); if (old && !lsGet(pkey('HCW'))) lsSet(pkey('HCW'), old); })();
function loadLocal(n) { try { const o = JSON.parse(lsGet(pkey(n)) || 'null'); if (o) return norm(o); } catch (e) {} return DEF(); }
const save = () => { S.updatedAt = Date.now(); lsSet(pkey(PROF), JSON.stringify(S)); schedulePush(); };
const url = (n, q = '') => `${FS}${n ? '/' + encodeURIComponent(n) : ''}?key=${CFG.apiKey}${q}`;
async function fsGet(n) { const r = await fetch(url(n)); if (r.status === 404) return null; if (!r.ok) throw r.status; const j = await r.json(); return norm(JSON.parse(j.fields.data.stringValue)); }
async function fsPut(n, o) { const r = await fetch(url(n, '&updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt'), {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({fields: {data: {stringValue: JSON.stringify(o)}, updatedAt: {integerValue: String(o.updatedAt)}}})}); if (!r.ok) throw r.status; }
async function fsList() { const r = await fetch(url('', '&pageSize=100')); if (!r.ok) throw r.status; const j = await r.json(); return (j.documents || []).map(d => decodeURIComponent(d.name.split('/').pop())); }
async function fsDel(n) { await fetch(url(n), {method: 'DELETE'}); }
function mark(st) { syncState = st; const e = document.getElementById('sync'); if (e) e.textContent = syncText(); }
const syncText = () => ({off: '僅存在這台裝置（尚未設定雲端同步）', idle: '雲端同步已開啟', syncing: '同步中…', ok: '已同步到雲端', err: '同步失敗，將稍後重試（資料仍保存在本機）'}[syncState]);
function schedulePush() { if (!SYNC_ON || !PROF) return; clearTimeout(pushT); mark('syncing'); pushT = setTimeout(push, 1500); }
async function push() { if (!SYNC_ON || !PROF) return; clearTimeout(pushT); pushT = null; try { await fsPut(PROF, S); mark('ok'); } catch (e) { mark('err'); } }
async function pull() {
  if (!SYNC_ON || !PROF || pushT) return; const me = PROF;
  try {
    mark('syncing'); const r = await fsGet(me); if (me !== PROF) return;
    if (r && r.updatedAt > S.updatedAt) { S = r; lsSet(pkey(me), JSON.stringify(S)); mark('ok'); render(); }
    else { if (!r || r.updatedAt < S.updatedAt) await fsPut(me, S); mark('ok'); }
  } catch (e) { mark('err'); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) push(); else pull(); });
function pickUser(n) { PROF = n; S = loadLocal(n); view = 'home'; cur = {ch: 0, mode: 'read', shuffle: []}; rv = null; render(); pull(); }
function switchUser() { push(); PROF = null; render(); }
function addUser() {
  const n = (prompt('新使用者名稱（例如 HCW）') || '').trim().slice(0, 20); if (!n) return;
  if (/[\/\\]/.test(n)) return alert('名稱不能包含 / 或 \\');
  if (profiles().includes(n)) return alert('已有同名使用者');
  setProfiles([...profiles(), n]); PROF = n; S = DEF(); save(); push(); PROF = null; render();
}
function delUser() {
  if (!confirm(`確定刪除使用者「${PROF}」以及所有學習紀錄？此動作無法復原。`)) return;
  const n = PROF; setProfiles(profiles().filter(x => x !== n)); try { localStorage.removeItem(pkey(n)); } catch (e) {}
  if (SYNC_ON) fsDel(n); PROF = null; render();
}
async function loadRemoteNames() { if (!SYNC_ON) return; try { const r = await fsList(); setProfiles([...profiles(), ...r]); if (!PROF) picker(); } catch (e) {} }
const hue = n => [...n].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 360;
function picker() {
  document.documentElement.dataset.theme = 'dark';
  $('#nav').innerHTML = '';
  $('#app').innerHTML = `<div style="min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><h1 style="font-size:30px;margin-bottom:28px">誰在學習？</h1>
  <div class="row" style="justify-content:center;gap:22px">${profiles().map(n => `<div class="pf" onclick="pickUser(decodeURIComponent('${encodeURIComponent(n).replace(/'/g, '%27')}'))"><div class="av" style="--h:${hue(n)}">${esc([...n][0].toUpperCase())}</div><div>${esc(n)}</div></div>`).join('')}
  <div class="pf" onclick="addUser()"><div class="av add"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><div>新增使用者</div></div></div>
  <div class="mute" style="margin-top:36px">${SYNC_ON ? '學習紀錄會同步到雲端，換裝置選同一個名字即可' : '提醒：尚未設定雲端同步，紀錄只存在這台裝置'}</div></div>`;
}
/* ---------- 遺忘曲線（固定階梯，單位：分鐘） ---------- */
const STEPS = [20, 1440, 2880, 5760, 10080, 21600, 43200]; // 20分,1,2,4,7,15,30天
const MIN = 60000;
const uw = id => S.words[id];
function addWord(id, chId) {
  if (!S.words[id]) S.words[id] = {inNb: true, stage: 0, due: Date.now() + STEPS[0] * MIN, reviews: 0, lapses: 0, mastered: false, ch: chId, added: Date.now()};
  else S.words[id].inNb = true;
  save();
}
function rate(id, r, src) { // r: good / hard / again
  const w = uw(id); if (!w) return;
  if (r === 'good') { w.stage++; if (w.stage >= STEPS.length) { w.mastered = true; w.stage = STEPS.length - 1; w.due = Date.now() + STEPS[STEPS.length - 1] * MIN; } else w.due = Date.now() + STEPS[w.stage] * MIN; }
  else if (r === 'hard') w.due = Date.now() + STEPS[Math.max(w.stage, 0)] * MIN;
  else { w.stage = 1; w.lapses++; w.mastered = false; w.due = Date.now() + STEPS[1] * MIN; }
  w.reviews++; w.last = Date.now(); w.inNb = true;
  S.log.push({id, r, src, at: Date.now()}); if (S.log.length > 3000) S.log.shift();
  save();
}
const dueList = () => Object.keys(S.words).filter(id => S.words[id].inNb && !S.words[id].mastered && S.words[id].due <= Date.now()).sort((a, b) => S.words[a].due - S.words[b].due).slice(0, S.set.limit);
function dueText(w) {
  if (w.mastered) return '已掌握';
  const m = (w.due - Date.now()) / MIN;
  if (m <= 0) return '現在可複習';
  if (m < 60) return Math.ceil(m) + ' 分鐘後複習';
  if (m < 1440) return Math.ceil(m / 60) + ' 小時後複習';
  return Math.ceil(m / 1440) + ' 天後複習';
}
/* ---------- 發音 ---------- */
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = S.set.accent === 'UK' ? 'en-GB' : 'en-US'; u.rate = .9; speechSynthesis.speak(u); } catch (e) {} }
/* ---------- 工具 ---------- */
const chapterById = id => D.novels[0].chapters.find(c => c.id === id);
function contextOf(id, chId, hl = true) { // 該字所在段落（含該章的句子）
  const ch = chapterById(chId) || D.novels[0].chapters.find(c => c.vocab.includes(id));
  if (!ch) return '';
  const p = ch.paras.find(p => p.some(s => s.t === 'word' && s.id === id)); if (!p) return '';
  const idx = p.findIndex(s => s.t === 'word' && s.id === id);
  const txt = p.map((s, i) => s.t === 'text' ? esc(s.v) : (i === idx && hl ? `<mark>${esc(s.id)}（${esc(s.zh)}）</mark>` : `${esc(s.id)}（${esc(s.zh)}）`)).join('');
  // 取以標點切開的句子
  const plain = txt.split(/(?<=[。！？])/); const hit = plain.find(x => x.includes('<mark>'));
  return hit ? hit.trim() : txt;
}
const chOf = id => (D.novels[0].chapters.find(c => c.vocab.includes(id)) || {}).id;
/* ---------- 路由 ---------- */
let rd = {}; // 閱讀頁填空作答：{單字id: 對/錯}（僅練習，不影響複習排程）
const rstat = () => `已答 ${Object.keys(rd).length} · 正確 ${Object.values(rd).filter(Boolean).length}`;
function wordHtml(x) {
  const s = S.set, a = rd[x.id], cls = a === undefined ? '' : a ? 'okc' : 'noc', id = esc(x.id), zh = esc(x.zh);
  const open = `onclick="card('${x.id}')"`;
  if (s.hz) { const n = [...x.zh].length; // 隱藏中文：英文（＿＿＿）
    return `<span class="w"><span ${open}>${id}</span>（${a === undefined ? `<input class="rin zh" data-id="${id}" maxlength="${n}" style="width:${n * 1.2}em" autocomplete="off" autocapitalize="off" onchange="rchk(this)">` : `<i class="${cls}">${zh}</i>`}）</span>`; }
  if (s.he) { const n = x.id.length; // 隱藏英文：＿＿＿（中文）
    return `<span class="w">${a === undefined ? `<input class="rin en" data-id="${id}" maxlength="${n}" style="width:${n * 1.35}ch" autocomplete="off" autocapitalize="off" spellcheck="false" onchange="rchk(this)">` : `<span class="${cls}" ${open}>${id}</span>`}<i>（${zh}）</i></span>`; }
  return `<span class="w" ${open}><span>${id}</span> <i>（${zh}）</i></span>`;
}
function rchk(el) {
  const id = el.dataset.id, w = D.words[id], v = el.value.trim(); if (!v || rd[id] !== undefined) return;

  document.addEventListener('selectionchange', () => { if (wbDraw || document.body.classList.contains('wb-open') && wbTouching) getSelection().removeAllRanges(); });
  let wbTouching = false, penSeen = 0;
  c.addEventListener('pointerdown', e => { e.preventDefault(); getSelection().removeAllRanges();
    if (e.pointerType === 'pen') penSeen = Date.now(); else if (e.pointerType === 'touch' && Date.now() - penSeen < 120000) return; // 用過 Pencil 就忽略手掌/手指
    wbTouching = true; c.setPointerCapture(e.pointerId); wbDraw = {c: wbEr ? '#000' : wbColor, e: wbEr, w: wbEr ? .035 : .006, p: [pt(e)]}; wbSeg(c.getContext('2d'), wbDraw, c.width, 0); });
  c.addEventListener('pointermove', e => { if (!wbDraw) return; e.preventDefault(); const n = wbDraw.p.length; wbDraw.p.push(pt(e)); wbSeg(c.getContext('2d'), wbDraw, c.width, n - 1); });
  const end = () => { wbTouching = false; if (wbDraw) { wbStrokes.push(wbDraw); wbDraw = null; wbSave(); } };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { document.body.classList.toggle('wb-open', !!(wbOpen && PROF && view === 'read')); wbSync(); }, 150); });
})();
loadRemoteNames();
render();
</script>
